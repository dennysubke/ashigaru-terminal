name: Docker Multiarch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.amd64'
      - 'Dockerfile.arm64'
      - 'docker-entrypoint.sh'
      - 'docker-entrypoint-arm64.sh'
      - '.github/workflows/docker-multiarch.yml'

env:
  IMAGE_NAME: dennysubke/ashigaru-terminal
  VERSION: 1.0.0

jobs:
  build-amd64:
    name: Build & Push amd64 Image (TTYD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.amd64
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-amd64
            ${{ env.IMAGE_NAME }}:latest-amd64

  build-arm64:
    name: Build & Push arm64 Image (Remote GUI)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-arm64
            ${{ env.IMAGE_NAME }}:latest-arm64

  create-manifest:
    name: Create Multiarch Manifest
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multiarch manifest (version tag)
        run: |
          docker buildx imagetools create \
            -t $IMAGE_NAME:$VERSION \
            $IMAGE_NAME:${VERSION}-amd64 \
            $IMAGE_NAME:${VERSION}-arm64

      - name: Create and push multiarch manifest (latest tag)
        run: |
          docker buildx imagetools create \
            -t $IMAGE_NAME:latest \
            $IMAGE_NAME:latest-amd64 \
            $IMAGE_NAME:latest-arm64
