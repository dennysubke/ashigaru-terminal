name: Build & Push Multiarch Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IMAGE_NAME: dennysubke/ashigaru-terminal
  VERSION: 1.0.0

jobs:
  build-amd64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-amd64
            ${{ env.IMAGE_NAME }}:latest-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-arm64
            ${{ env.IMAGE_NAME }}:latest-arm64

  create-manifest:
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multiarch manifest (VERSION)
        run: |
          docker buildx imagetools create \
            -t $IMAGE_NAME:$VERSION \
            $IMAGE_NAME:${VERSION}-amd64 \
            $IMAGE_NAME:${VERSION}-arm64

      - name: Create and push multiarch manifest (latest)
        run: |
          docker buildx imagetools create \
            -t $IMAGE_NAME:latest \
            $IMAGE_NAME:latest-amd64 \
            $IMAGE_NAME:latest-arm64
